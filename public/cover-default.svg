<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#2C2420" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Base warm dark -->
  <rect width="800" height="320" fill="#1C1917"/>

  <!-- Subtle dot texture -->
  <rect width="800" height="320" fill="url(#dots)"/>

  <!-- Coffee ring — large, left -->
  <circle cx="160" cy="170" r="110" fill="none" stroke="#2C2420" stroke-width="1.5"/>
  <circle cx="160" cy="170" r="72"  fill="none" stroke="#2C2420" stroke-width="1"/>
  <circle cx="160" cy="170" r="36"  fill="none" stroke="#2C2420" stroke-width="0.8"/>

  <!-- Coffee ring — smaller, right -->
  <circle cx="620" cy="155" r="85"  fill="none" stroke="#2C2420" stroke-width="1.5"/>
  <circle cx="620" cy="155" r="52"  fill="none" stroke="#2C2420" stroke-width="1"/>

  <!-- Accent ring — top right -->
  <circle cx="760" cy="50"  r="60"  fill="none" stroke="#2C2420" stroke-width="1" opacity="0.7"/>

  <!-- Subtle warm accent spot -->
  <ellipse cx="400" cy="160" rx="180" ry="80" fill="#2C1F18" opacity="0.4"/>
</svg>
